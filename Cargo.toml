[package]
name = "version-replay"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Replay redacted, version-labelled HTTP fixtures against localhost"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-api-version-replay"
readme = "README.md"
keywords = ["webhook", "testing", "api", "cli"]
categories = ["command-line-utilities", "development-tools::testing"]
include = [
  "/src/**",
  "/examples/**",
  "/tests/**",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/Cargo.toml",
  "/Cargo.lock"
]

[[bin]]
name = "vr"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1.0"
argon2 = "0.5"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12"
ureq = { version = "2.12", features = ["json"] }
url = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.14"

[profile.release]
lto = "thin"
strip = true
